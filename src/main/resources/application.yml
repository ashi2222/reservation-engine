server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/reservation_engine
    username: reservation
    password: reservation

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false

app:
  kafka:
    topics:
      reservation-events: reservation-events
      reservation-events-dlq: reservation-events.DLT
    consumer:
      payment-group-id: payment-worker-group
      notification-group-id: notification-worker-group
      dlq-group-id: dlq-worker-group
    retry:
      max-attempts: 3
      backoff-interval-ms: 500
  outbox:
    enabled: true
    polling-interval-ms: 1000
    batch-size: 50
    max-retries: 5
    send-timeout-seconds: 5
  lock:
    watchdog-timeout-ms: 30000
  worker:
    expiry:
      enabled: true
      interval-ms: 5000
      batch-size: 50
      lock-name: reservation-engine:worker:expiry
    reconciliation:
      enabled: true
      interval-ms: 30000
      batch-size: 50
      lock-name: reservation-engine:worker:reconciliation